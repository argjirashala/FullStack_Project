name: CI

on:
  push:
    branches: [main, ci-cd]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20" # Adjust the Node version if needed

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test
